<style>
/* Joint: identidade preto e branco (a logo). Sem cores: o estado é dito por forma e contraste.
   Pessoa 1 = selo branco cheio; Pessoa 2 = selo vazado. Estouro de orçamento = barra listrada + selo "▲". Gráfico: linha cheia (base), tracejadas (cenários), pontilhada (investido). */
:root{
  --bg:#000; --surface:#0d0d0d; --surface2:#1b1b1b; --fg:#fff; --muted:#8c8c8c; --line:rgba(255,255,255,.14);
  --c1:#fff; --c2:#bdbdbd; --c3:#a3a3a3; --ink:#000; --pa:#6b6b6b; --pb:#fff; --ser:#fff;
  --warn:#fff; --warn-soft:rgba(255,255,255,.12); --tint1:rgba(255,255,255,.06); --tint3:rgba(255,255,255,.08);
  --glass:rgba(16,16,16,.8); --shadow:0 14px 34px rgba(0,0,0,.6); --glow1:rgba(255,255,255,.05); --glow2:rgba(255,255,255,.03);
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Manrope",-apple-system,system-ui,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#fff; --surface:#fff; --surface2:#f0f0f0; --fg:#000; --muted:#6a6a6a; --line:rgba(0,0,0,.16);
  --c1:#000; --c2:#454545; --c3:#6f6f6f; --ink:#fff; --pa:#a8a8a8; --pb:#000; --ser:#000;
  --warn:#000; --warn-soft:rgba(0,0,0,.08); --tint1:rgba(0,0,0,.04); --tint3:rgba(0,0,0,.06);
  --glass:rgba(255,255,255,.85); --shadow:0 14px 34px rgba(0,0,0,.14); --glow1:rgba(0,0,0,.04); --glow2:rgba(0,0,0,.02);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#fff; --surface:#fff; --surface2:#f0f0f0; --fg:#000; --muted:#6a6a6a; --line:rgba(0,0,0,.16);
  --c1:#000; --c2:#454545; --c3:#6f6f6f; --ink:#fff; --pa:#a8a8a8; --pb:#000; --ser:#000;
  --warn:#000; --warn-soft:rgba(0,0,0,.08); --tint1:rgba(0,0,0,.04); --tint3:rgba(0,0,0,.06);
  --glass:rgba(255,255,255,.85); --shadow:0 14px 34px rgba(0,0,0,.14); --glow1:rgba(0,0,0,.04); --glow2:rgba(0,0,0,.02);
  color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;background-color:var(--bg);
  background-image:radial-gradient(120% 55% at 0% -8%,var(--glow1),transparent 60%),radial-gradient(90% 45% at 100% 0%,var(--glow2),transparent 62%);
  background-repeat:no-repeat;
  padding-block:max(18px,env(safe-area-inset-top,0px)) calc(120px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.noscroll{overflow:hidden}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:14px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:6px 2px 2px}
h1{font-weight:800;font-size:clamp(1.8rem,7.5vw,2.4rem);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;font-size:.95rem;font-weight:500}
h3{font-weight:700;font-size:1.05rem;margin:0;letter-spacing:-.01em}
h4{font-weight:700;font-size:.82rem;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
button,input,select{font-family:var(--body);font-size:1rem;color:inherit}
button{cursor:pointer}
.round{position:relative;flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;font-weight:800}
.dotsync{position:absolute;right:1px;top:1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);background:var(--muted)}
.dotsync.ok{background:var(--c1)}.dotsync.pend{background:var(--muted)}.dotsync.err{background:var(--bg);border-color:var(--fg)}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tap{cursor:pointer;text-align:left}
.hero{border-radius:26px;padding:16px;gap:10px;background:linear-gradient(155deg,var(--tint1),transparent 52%),var(--surface);box-shadow:var(--shadow)}
.hero-in{display:grid;grid-template-columns:minmax(0,118px) minmax(0,1fr);gap:16px;align-items:center}
.dial{width:100%;height:auto;display:block}
.dial circle{fill:none;stroke-linecap:round}
.tr{stroke:var(--line)}.r1{stroke:var(--c1)}.r2{stroke:var(--c3)}.r3{stroke:var(--pa)}
.dialk{fill:var(--fg);font:600 20px var(--display);letter-spacing:.04em}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.legend li{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.legend .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:.8rem;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.legend b{font-family:var(--display);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums}
.legend small{display:block;font-size:.74rem;color:var(--muted);font-weight:600;text-align:right;line-height:1.2}
.legend li>span:last-child{text-align:right}
.note{margin:0;color:var(--muted);font-size:.84rem}
.note b{color:var(--fg)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{color:var(--muted);font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-family:var(--display);font-weight:600;font-size:1.55rem;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pos{color:var(--fg)}.neg{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.seg button{border:0;background:transparent;border-radius:13px;padding:9px 6px;font-weight:700;color:var(--muted);min-height:40px}
.seg button.on{background:var(--c1);color:var(--ink)}
.seg.p button.on.a{background:var(--fg);color:var(--bg)}.seg.p button.on.b{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--fg)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font-weight:800;font-size:1.1rem}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-weight:700;min-height:44px}
.btn{border:0;background:var(--c1);color:var(--ink);border-radius:16px;padding:13px 18px;font-weight:800;min-height:48px}
.btn.sec{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.btn.full{width:100%}
.catrow{display:flex;flex-direction:column;gap:5px;cursor:pointer;background:none;border:0;padding:0;text-align:left;width:100%}
.bar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:0 5px 5px 0;background:var(--c1)}
.bar i.over{background:repeating-linear-gradient(135deg,var(--fg) 0 5px,var(--muted) 5px 10px)}
.bar i.g{background:var(--c3)}
.bar i.pa{background:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.badge.warn{background:var(--fg);color:var(--bg)}
.badge.a{background:var(--fg);color:var(--bg)}
.badge.b{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.tx{display:flex;align-items:center;gap:12px;padding:11px 2px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;min-width:0}
.tx:first-child{border-top:0}
.tx .ico{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);font-weight:800;color:var(--muted);font-size:.85rem}
.tx .v{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx .t1{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t2{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dayh{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 2px 0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
label.f.chk{flex-direction:row;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--fg)}
input[type=text],input[type=date],input[type=month],input[type=number],input[type=password],select{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:48px;text-transform:none;letter-spacing:0;font-weight:600;color:var(--fg)}
input.big{font-family:var(--display);font-size:2rem;font-weight:600;min-height:62px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--c1)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem;min-height:40px}
.chip.on{background:var(--c1);color:var(--ink);border-color:transparent}
.bigv{font-family:var(--display);font-weight:600;font-size:2.7rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.005em;overflow-wrap:anywhere}
.legendrow{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);font-weight:600}
.legendrow span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top:2px solid var(--ser);display:inline-block}
.sw.d{border-top-style:dashed}
.chartbox{position:relative;width:100%;max-width:560px;margin:0 auto;touch-action:pan-y}
.chartbox svg{width:100%;height:auto;display:block}
.gridl{stroke:var(--line);stroke-width:1}
.axt{fill:var(--muted);font:600 11px var(--body)}
.lnk{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tip{position:absolute;pointer-events:none;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.78rem;box-shadow:var(--shadow);min-width:150px;z-index:3}
.tip b{display:block;margin-bottom:3px}
.tip div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.78rem;font-variant-numeric:tabular-nums}
th{font-size:.64rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:right;padding:6px 3px;font-weight:800}
td{text-align:right;padding:8px 3px;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-weight:800}
.tablewrap{overflow-x:auto}
details{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
summary{font-weight:700;cursor:pointer;min-height:28px}
details p{font-size:.86rem;color:var(--muted);margin:8px 0 0}
details p b{color:var(--fg)}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:.92rem}
/* barra de abas flutuante */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:2px;padding:7px;border-radius:26px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:var(--shadow);z-index:20}
.tabbar button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:700;padding:7px 2px;border-radius:18px;min-height:54px}
.tabbar button.on{color:var(--c1)}
.tabbar .fab{background:var(--c1);color:var(--ink);width:56px;height:56px;border-radius:50%;margin:-18px auto 0;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.tabbar .fab svg{width:26px;height:26px;stroke-width:2.4}
/* folha inferior */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet-body{position:relative;width:min(640px,100%);max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:3px;background:var(--line);margin:0 auto -4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:.9rem;z-index:60;max-width:90%}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.bar i,.dial circle{transition:stroke-dasharray .5s ease,width .5s ease}}

/* tela de abertura: fundo branco com o ícone no centro (igual às imagens de abertura do iOS) */

#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(34vw,170px);height:auto;border-radius:14%}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}

/* tela de acesso (usuário + PIN) */
#auth{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:16px max(20px,env(safe-area-inset-right,0px)) 16px max(20px,env(safe-area-inset-left,0px));overflow:auto}
.auth-in{width:min(320px,100%);display:flex;flex-direction:column;gap:9px}
.auth-logo{width:52px;height:52px;border-radius:13px;align-self:center}
.auth-in h2{margin:0;text-align:center;font-weight:800;font-size:1.45rem;letter-spacing:-.02em;line-height:1.1}
.auth-sub{margin:0 0 4px;text-align:center;color:var(--muted);font-size:.8rem;line-height:1.35}
.af{display:flex;flex-direction:column;gap:4px;font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.af input{font-size:.95rem;font-weight:600;text-transform:none;letter-spacing:normal;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 12px;min-height:40px;width:100%}

.af input.pin::placeholder{letter-spacing:.4em}
.auth-msg{min-height:1.1em;margin:0;text-align:center;font-size:.78rem;font-weight:700;color:var(--fg);line-height:1.3}
.auth-in .btn{min-height:42px;padding:9px 16px;border-radius:12px;font-size:.95rem}
.auth-link{background:none;border:0;color:var(--muted);font-weight:700;font-size:.8rem;text-decoration:underline;text-underline-offset:3px;padding:4px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* gamificação: sequências, marcos e conquistas (preto e branco: cheio = feito, vazado = falta) */
.week{display:flex;gap:6px;justify-content:space-between}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.wd i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:block}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stp{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.stp i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.9rem}
.stp.on i{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stp.next i{border-color:var(--fg);border-style:dashed}
.stp b{font-size:.85rem}.stp small{font-size:.68rem;color:var(--muted);font-weight:600}
.achgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}

.ach .seal{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.ach b{font-size:.88rem;color:var(--muted)}.ach small{font-size:.72rem;line-height:1.3}
.ach.on{border-color:var(--fg);color:var(--fg)}.ach.on b{color:var(--fg)}.ach.on .seal{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ach em{font-style:normal;font-size:.68rem;font-weight:700}
.row.sp>.badge{white-space:nowrap;flex:none}

<script>
(function(){
"use strict";
/* ===== NÚCLEO FINANCEIRO (funções puras, testadas em tests/core.test.js) ===== */
var DPM = 365.25 / 12; // dias médios por mês, usado só para a faixa do IR

/* taxa mensal efetiva equivalente a uma taxa anual efetiva: (1+a)^(1/12)-1 (juros compostos, não a/12) */
function mRate(aa) { return Math.pow(1 + aa, 1 / 12) - 1; }

/* IR regressivo da renda fixa sobre o rendimento, pela idade da aplicação em dias */
function irRate(days) { return days <= 180 ? 0.225 : days <= 360 ? 0.20 : days <= 720 ? 0.175 : 0.15; }

/* aporte do mês m (1..n): reajustado uma vez a cada 12 meses */
function pmtAt(p, m) { return p.pmt * Math.pow(1 + (p.growth || 0), Math.floor((m - 1) / 12)); }

/* Simula mês a mês. Cada aporte é um "lote" com a própria idade, porque o IR incide por lote.
   p: {p0, pmt, growth, rate (a.a. efetiva), infl (a.a.), months, ir (bool), begin (bool: aporte no início do mês)}
   Retorna séries t=0..months: inv (investido), gross (bruto), net (líquido de IR se resgatar em t), real (net em valores de hoje) */
function simulate(p) {
  var n = p.months, i = mRate(p.rate), inf = p.infl || 0;
  var lots = [{ s: 0, a: p.p0 || 0 }];
  var inv = [p.p0 || 0], gross = [p.p0 || 0], net = [p.p0 || 0], real = [p.p0 || 0];
  var cum = p.p0 || 0;
  for (var t = 1; t <= n; t++) {
    var amt = pmtAt(p, t);
    lots.push({ s: p.begin ? t - 1 : t, a: amt });
    cum += amt;
    var g = 0, tax = 0;
    for (var k = 0; k < lots.length; k++) {
      var age = t - lots[k].s; if (age < 0) age = 0;
      var v = lots[k].a * Math.pow(1 + i, age);
      g += v;
      if (p.ir && v > lots[k].a) tax += (v - lots[k].a) * irRate(age * DPM);
    }
    inv.push(cum); gross.push(g); net.push(g - tax);
    real.push((g - tax) / Math.pow(1 + inf, t / 12));
  }
  return { inv: inv, gross: gross, net: net, real: real };
}

/* aporte mensal inicial necessário para o saldo líquido chegar a "target" em p.months (bisseção sobre a simulação:
   funciona com IR, reajuste e aporte no início porque o saldo é crescente no aporte) */
function solvePmt(p, target) {
  var q = {}, k; for (k in p) q[k] = p[k];
  q.pmt = 0;
  if (simulate(q).net[p.months] >= target) return 0;
  var lo = 0, hi = Math.max(1, target / p.months);
  q.pmt = hi;
  var guard = 0;
  while (simulate(q).net[p.months] < target && guard++ < 60) { hi *= 2; q.pmt = hi; }
  for (var it = 0; it < 50; it++) {
    var mid = (lo + hi) / 2; q.pmt = mid;
    if (simulate(q).net[p.months] >= target) hi = mid; else lo = mid;
  }
  return hi;
}

/* primeiro mês em que o saldo líquido atinge "target" (até maxM); null se não chega */
function solveMonths(p, target, maxM) {
  var q = {}, k; for (k in p) q[k] = p[k];
  q.months = maxM || 600;
  var s = simulate(q);
  for (var t = 0; t <= q.months; t++) if (s.net[t] >= target) return t;
  return null;
}

/* fórmula fechada (sem IR, aporte no fim do mês, sem reajuste) usada só como prova nos testes */
function fvClosed(p0, pmt, aa, n) {
  var i = mRate(aa);
  return p0 * Math.pow(1 + i, n) + (i === 0 ? pmt * n : pmt * (Math.pow(1 + i, n) - 1) / i);
}

/* ---- divisão de despesas do casal (centavos inteiros) ---- */
/* tx: {k:"o"|"i"|"t", v:centavos, w:0|1 (quem pagou), s:0|1|2 (0=divide, 1=só de quem pagou, 2=só do outro)}; split = % da pessoa 0 */
function shares(tx, split) {
  var a;
  if (tx.s === 1) a = tx.w === 0 ? tx.v : 0;
  else if (tx.s === 2) a = tx.w === 0 ? 0 : tx.v;
  else a = Math.round(tx.v * split / 100);
  return [a, tx.v - a];
}
/* saldo entre os dois: positivo = pessoa 1 deve à pessoa 0; negativo = pessoa 0 deve à pessoa 1.
   acerto (k:"t") entra como pagamento de w para o outro */
function balance(list, split) {
  var net0 = 0;
  list.forEach(function (tx) {
    if (tx.x) return;
    if (tx.k === "o") { var sh = shares(tx, split); net0 += (tx.w === 0 ? tx.v : 0) - sh[0]; }
    else if (tx.k === "t") { net0 += tx.w === 0 ? tx.v : -tx.v; } // quem repassa dinheiro quita (ou cria crédito) com o outro
  });
  return net0;
}
/* parse de dinheiro brasileiro ("1.234,56", "R$ 50", "12.5") para centavos */
function parseMoney(s) {
  s = String(s == null ? "" : s).replace(/[^\d,.\-]/g, "");
  if (!s) return 0;
  if (s.indexOf(",") >= 0) s = s.replace(/\./g, "").replace(",", ".");
  else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, "");
  else if (/^\d{1,3}\.\d{3}$/.test(s)) s = s.replace(".", "");
  var n = parseFloat(s);
  return isFinite(n) ? Math.round(n * 100) : 0;
}

/* ===== GAMIFICAÇÃO (funções puras) ===== */
function p2(n) { return ("0" + n).slice(-2); }
/* datas ISO "AAAA-MM-DD" em UTC (sem efeito de fuso/horário de verão) */
function dayAdd(iso, k) {
  var d = new Date(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10) + k));
  return d.getUTCFullYear() + "-" + p2(d.getUTCMonth() + 1) + "-" + p2(d.getUTCDate());
}
function dayDiff(a, b) {
  var f = function (x) { return Date.UTC(+x.slice(0, 4), +x.slice(5, 7) - 1, +x.slice(8, 10)); };
  return Math.round((f(b) - f(a)) / 864e5);
}
function nextYm(ym) { var y = +ym.slice(0, 4), m = +ym.slice(5, 7) + 1; if (m > 12) { m = 1; y++; } return y + "-" + p2(m); }
function quarterKey(iso) { return iso.slice(0, 4) + "T" + Math.floor((+iso.slice(5, 7) - 1) / 3); }
function halfKey(ym) { return ym.slice(0, 4) + "S" + (+ym.slice(5, 7) <= 6 ? 0 : 1); }
/* Sequência com "folga": a primeira unidade sem registro de cada período é perdoada (a sequência segue, sem contar o dia);
   a segunda no mesmo período zera. A unidade atual em aberto (graceLast) não conta como falha. */
function streakScan(seq, ok, keyOf, graceLast) {
  var run = 0, best = 0, used = {}, last = seq.length - 1;
  for (var i = 0; i <= last; i++) {
    var u = seq[i];
    if (ok[u]) { run++; if (run > best) best = run; }
    else if (i === last && graceLast) { /* em aberto */ }
    else if (run > 0) { var k = keyOf(u); if (!used[k]) used[k] = 1; else run = 0; }
  }
  return { n: run, best: best, doneNow: last >= 0 && !!ok[seq[last]], freezeUsed: last >= 0 ? !!used[keyOf(seq[last])] : false };
}
/* dias seguidos com registro (days = {"AAAA-MM-DD": true}); folga: 1 por trimestre */
function logStreak(days, today) {
  var first = null, k;
  for (k in days) if (days[k] && k <= today && (first === null || k < first)) first = k;
  if (first === null) return { n: 0, best: 0, doneNow: false, freezeUsed: false };
  var seq = [], d = first;
  while (d <= today) { seq.push(d); d = dayAdd(d, 1); }
  return streakScan(seq, days, quarterKey, true);
}
/* meses fechados seguidos dentro do plano (okMonths = {"AAAA-MM": true}); folga: 1 por semestre. O mês atual não entra. */
function planStreak(okMonths, firstYm, curYm) {
  var seq = [], m = firstYm;
  while (m < curYm) { seq.push(m); m = nextYm(m); }
  if (!seq.length) return { n: 0, best: 0, doneNow: false, freezeUsed: false };
  return streakScan(seq, okMonths, halfKey, false);
}
/* marcos da meta (ex.: 25/50/75/100%): reached e a data do aporte que cruzou o marco (null se já vinha do valor inicial) */
function milestones(base, conts, target, pcts) {
  var list = (conts || []).slice().sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
  return pcts.map(function (p) {
    var amt = Math.round(target * p / 100), cum = base || 0, date = null, reached = target > 0 && cum >= amt;
    if (!reached && target > 0) for (var i = 0; i < list.length; i++) { cum += list[i].v; if (cum >= amt) { reached = true; date = list[i].d; break; } }
    return { p: p, amt: amt, reached: reached, date: date };
  });
}

/* ===== PARCELAS E CARTÃO (funções puras) ===== */
/* soma k meses a uma data ISO, sem estourar o fim do mês (31/01 + 1 mês = 28/02) */
function addMonths(iso, k) {
  var y = +iso.slice(0, 4), m = +iso.slice(5, 7) - 1 + k, d = +iso.slice(8, 10);
  var t = new Date(Date.UTC(y, m, 1)); y = t.getUTCFullYear(); m = t.getUTCMonth();
  var last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  return y + "-" + p2(m + 1) + "-" + p2(Math.min(d, last));
}
/* fatura de uma compra: até o dia de fechamento entra na fatura do mês; depois, na do mês seguinte.
   O vencimento é o primeiro dia "due" depois do fechamento. m = mês do vencimento (quando o dinheiro sai). */
function invoiceOf(dateIso, close, due) {
  var ym = dateIso.slice(0, 7), cm = +dateIso.slice(8, 10) <= close ? ym : nextYm(ym);
  var dm = due > close ? cm : nextYm(cm);
  var last = new Date(Date.UTC(+dm.slice(0, 4), +dm.slice(5, 7), 0)).getUTCDate();
  return { m: dm, due: dm + "-" + p2(Math.min(due, last)) };
}
/* divide o total (centavos) em n parcelas; os centavos que sobram vão para a primeira */
function splitParcelas(total, n) {
  var base = Math.floor(total / n), out = [];
  for (var i = 0; i < n; i++) out.push(base);
  out[0] += total - base * n;
  return out;
}
/* valor presente do parcelado (1ª parcela em 30 dias) se o dinheiro ficasse aplicado a aa (a.a.), com IR regressivo:
   quanto seria preciso ter hoje, aplicado, para pagar cada parcela. Pagar à vista por menos que isso compensa. */
function parcelPV(total, n, aa) {
  var P = splitParcelas(total, n), pv = 0;
  for (var k = 1; k <= n; k++) {
    var g = Math.pow(1 + aa, k / 12) - 1, ir = irRate(Math.round(k * 365.25 / 12));
    pv += P[k - 1] / (1 + g * (1 - ir));
  }
  return pv;
}
/* taxa mensal implícita no parcelado frente ao preço à vista (soma das parcelas descontadas = à vista); null se à vista >= total */
function parcelRate(avista, total, n) {
  if (!(avista > 0) || avista >= total) return null;
  var P = splitParcelas(total, n), f = function (i) { var s = 0; for (var k = 1; k <= n; k++) s += P[k - 1] / Math.pow(1 + i, k); return s - avista; };
  var lo = 0, hi = 5;
  for (var it = 0; it < 200; it++) { var mid = (lo + hi) / 2; if (f(mid) > 0) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
/* ===== FIM DO NÚCLEO ===== */


/* ---------- utilidades ---------- */
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return n<10?"0"+n:""+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return iso(new Date())}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function clone(o){return JSON.parse(JSON.stringify(o))}
var MESL=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"],MESC=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
function ymLabel(ym){return MESL[+ym.slice(5,7)-1]+" de "+ym.slice(0,4)}
function ymTitle(ym){var t=ymLabel(ym);return t.charAt(0).toUpperCase()+t.slice(1)}
function ymShort(ym){return MESL[+ym.slice(5,7)-1].slice(0,3)+"/"+ym.slice(2,4)}
function ymAdd(ym,k){var d=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+k,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function dim(ym){return new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate()}
function brl(c){var v=Math.abs(c)/100;return (c<0?"−":"")+"R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function brl0(c){var v=Math.abs(c)/100;return (c<0?"−":"")+"R$ "+v.toLocaleString("pt-BR",{maximumFractionDigits:0})}
function brlR(v){return brl(Math.round(v*100))}
function brlR0(v){return brl0(Math.round(v*100))}
function pc(x,d){return (x*100).toLocaleString("pt-BR",{minimumFractionDigits:d||0,maximumFractionDigits:d||0})+"%"}
function nf(v,d){return Number(v).toLocaleString("pt-BR",{maximumFractionDigits:d==null?2:d})}
function fin(c){return c?(c/100).toFixed(2).replace(".",","):""}   /* centavos -> texto de input */
function fnum(v){return v?String(v).replace(".",","):""}
function ymOf(d){return String(d).slice(0,7)}
function dayLabel(d){var x=new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10));var w=["dom","seg","ter","qua","qui","sex","sáb"][x.getDay()];return w+", "+pad(x.getDate())+"/"+pad(x.getMonth()+1)}
function compact(v){var a=Math.abs(v);if(a>=1e6)return "R$ "+nf(v/1e6,1)+" mi";if(a>=1e3)return "R$ "+nf(v/1e3,a>=1e4?0:1)+" mil";return "R$ "+nf(v,0)}
function n0(v){return v>=1e6?nf(v/1e6,2)+' mi':Math.round(v).toLocaleString('pt-BR')}
function mLabel(m){if(m<24||m%12)return m+(m===1?" mês":" meses");return (m/12)+" anos"}

/* ---------- estado ---------- */
var KEY="joint.v1",MEKEY="joint.me",SYKEY="joint.sync",THKEY="joint.theme";
var EXP=["Moradia","Mercado","Restaurantes","Transporte","Saúde","Lazer","Viagem","Assinaturas","Educação","Casa","Pessoal","Presentes","Outros"];
var INC=["Salário","Extra","Rendimentos","Outros"];
var TRIP=["Passagens","Hospedagem","Alimentação","Transporte local","Passeios","Seguro viagem","Compras e lembranças"];
function blank(){return {cfg:{names:["Gabriel","Dayse"],split:50,saveTarget:20,cdi:13.65,infl:4.5,spread:2,goalPct:100,cats:EXP.slice(),u:0},tx:[],rec:[],goals:[],cont:[],day:[],ach:[],cards:[],bud:{v:{},u:0},sim:null,updatedAt:0}}
function load(){var d=blank();try{var r=JSON.parse(localStorage.getItem(KEY));if(r&&typeof r==="object"){for(var k in d)if(r[k]!==undefined)d[k]=r[k];var b=blank().cfg;for(k in b)if(d.cfg[k]===undefined)d.cfg[k]=b[k]}}catch(e){}return d}
var S=load(),saveT=null;
function persist(){clearTimeout(saveT);saveT=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.updatedAt=Date.now();sync.dirty=true;sync.seq++;if(!saveT)saveT=setTimeout(persist,250);schedPush();updDot()}
window.addEventListener("pagehide",function(){if(saveT)persist()});
function ME(){var m=parseInt(localStorage.getItem(MEKEY),10);return m===1?1:0}
function hasMe(){return localStorage.getItem(MEKEY)!==null}
function NM(i){return S.cfg.names[i]||("Pessoa "+(i+1))}
function find(list,id){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];return null}
function upsert(list,o){o.u=Date.now();for(var i=0;i<list.length;i++)if(list[i].id===o.id){list[i]=o;return}list.push(o)}
function del(list,id){var o=find(list,id);if(o){o.x=1;o.u=Date.now()}}
function live(list){return list.filter(function(x){return !x.x})}
var tab="home",month=today().slice(0,7),whoF=-1,goalId=null,draft=null,sheetKind="";

/* ---------- fixos recorrentes: viram lançamentos com id determinístico (u=1: qualquer edição ou exclusão vence) ---------- */
function ensureRec(){
  var cur=today().slice(0,7),changed=false;
  live(S.rec).forEach(function(r){
    var ym=r.from||cur,n=0;
    while(ym<=cur&&n++<120){
      var id="r"+r.id+"_"+ym;
      if(!find(S.tx,id)){var nt={id:id,k:r.k,v:r.v,d:ym+"-"+pad(Math.min(r.day||1,dim(ym))),c:r.c,w:r.w,s:r.s||0,n:r.n,r:r.id,u:1},cc=r.cd?find(S.cards,r.cd):null;if(cc&&!cc.x){nt.cd=cc.id;nt.m=invoiceOf(nt.d,cc.close,cc.due).m}S.tx.push(nt);changed=true}
      ym=ymAdd(ym,1);
    }
  });
  if(changed)save();
}

/* ---------- agregados ---------- */
function tm(t){return t.m||t.d.slice(0,7)}   /* mês em que o lançamento pesa: o da fatura (cartão) ou o da data */
function monthTx(ym){return S.tx.filter(function(t){return !t.x&&tm(t)===ym})}
function cardName(id){var c=find(S.cards,id);return c?c.name:"Cartão"}
function summary(ym,who){
  var r={inc:0,exp:0,cat:{},fixed:0};
  monthTx(ym).forEach(function(t){
    if(t.k==="i"){if(who<0||t.w===who)r.inc+=t.v}
    else if(t.k==="o"){var v=who<0?t.v:shares(t,S.cfg.split)[who];r.exp+=v;r.cat[t.c]=(r.cat[t.c]||0)+v;if(t.r||t.ip)r.fixed+=v}   /* fixos e parcelas são compromissos conhecidos: não entram na projeção pelo ritmo diário */
  });
  return r;
}
function budTotal(){var s=0;for(var k in S.bud.v)s+=S.bud.v[k]||0;return s}
function goalTarget(g){if(g.type==="viagem"){var s=0;(g.items||[]).forEach(function(i){s+=i.v||0});return Math.round(s*(1+(g.margin||0)/100))}return g.target||0}
function goalSaved(g){var s=g.base||0;S.cont.forEach(function(c){if(!c.x&&c.g===g.id)s+=c.v});return s}
function monthsLeft(due){if(!due)return 0;var n=new Date();return Math.max(0,(+due.slice(0,4))*12+(+due.slice(5,7))-(n.getFullYear()*12+n.getMonth()+1))}
function goalRate(){return S.cfg.cdi*S.cfg.goalPct/100/100}
function goalNeed(g){
  var tg=goalTarget(g),sv=goalSaved(g),n=monthsLeft(g.due),tn=tg;
  if(g.infl&&n>0)tn=Math.round(tg*Math.pow(1+S.cfg.infl/100,n/12));
  var pmt=0;
  if(sv<tn){ if(n<=0)pmt=(tn-sv)/100; else pmt=solvePmt({p0:sv/100,pmt:0,growth:0,rate:goalRate(),infl:0,months:n,ir:true,begin:false},tn/100) }
  return {tg:tg,sv:sv,n:n,tn:tn,pmt:pmt,done:tg>0&&sv>=tg,p:tg>0?Math.min(1,sv/tg):0};
}
function goalPace(g){ /* média mensal dos aportes dos últimos 90 dias, em centavos */
  var lim=new Date();lim.setDate(lim.getDate()-90);var l=iso(lim),s=0;
  S.cont.forEach(function(c){if(!c.x&&c.g===g.id&&c.d>=l)s+=c.v});return s/3;
}


/* ---------- gamificação: sequências, marcos e conquistas ----------
   Tudo é derivado dos lançamentos. Só se gravam as datas de desbloqueio (S.ach) e os dias marcados "sem gastos" (S.day). */
function dBR(d){return d?d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(0,4):""}
function actDays(){
  var o={};

  S.cont.forEach(function(c){if(!c.x&&c.d)o[c.d]=true});

function monthsSeen(){var m={};S.tx.forEach(function(t){if(!t.x&&t.d)m[tm(t)]=1});return Object.keys(m).sort()}
function planInfo(){   /* mês "no plano": houve renda e a poupança do mês >= meta de poupança */
  var ok={},first=null;
  monthsSeen().forEach(function(ym){var sm=summary(ym,-1);if(sm.inc>0){if(first===null)first=ym;ok[ym]=sm.exp<=sm.inc*(1-S.cfg.saveTarget/100)+0.5}});

}
function budFaithful(){   /* último mês fechado com orçamento definido e nenhuma categoria orçada estourada */

function reserveInfo(){   /* metas (exceto viagens) em meses de gasto médio dos últimos 3 meses fechados */

  var avg=ms.length?ms.reduce(function(a,ym){return a+summary(ym,-1).exp},0)/ms.length:0,saved=0;
  live(S.goals).forEach(function(g){if(g.type!=="viagem")saved+=goalSaved(g)});

function duplaAt(){   /* primeiro mês em que os dois aportaram: data em que o segundo aportou */

  S.cont.forEach(function(c){if(c.x||!c.d)return;var ym=c.d.slice(0,7),w=c.w===1?1:0;by[ym]=by[ym]||{};if(!by[ym][w]||c.d<by[ym][w])by[ym][w]=c.d});
  Object.keys(by).forEach(function(ym){var o=by[ym];if(o[0]&&o[1]){var at=o[0]>o[1]?o[0]:o[1];if(best===null||at<best)best=at}});

  c.firstTx=null;S.tx.forEach(function(x){if(!x.x&&!x.r&&x.k!=="t"&&!(x.in>1)&&x.d&&(c.firstTx===null||x.d<c.firstTx))c.firstTx=x.d});
  c.firstCont=null;S.cont.forEach(function(x){if(!x.x&&x.d&&(c.firstCont===null||x.d<c.firstCont))c.firstCont=x.d});

var PRES={cdb:{l:"CDB / Tesouro Selic",d:"100% do CDI, IR regressivo",rate:function(){return S.cfg.cdi},ir:true},lci:{l:"LCI / LCA",d:"90% do CDI, isento de IR",rate:function(){return S.cfg.cdi*0.9},ir:false},poup:{l:"Poupança",d:"0,5% a.m. (≈ 6,17% a.a.), isenta",rate:function(){return 6.17},ir:false},custom:{l:"Personalizada",d:"você define a taxa e o IR"}};

function simCalc(){
  var s=simS(),pr=PRES[s.preset]||PRES.cdb,rate=pr.rate?pr.rate():s.rate,ir=pr.rate?pr.ir:!!s.ir,sp=S.cfg.spread;
  var base={p0:s.p0,pmt:s.pmt,growth:s.growth/100,infl:S.cfg.infl/100,months:s.months,ir:ir,begin:false};
  var rates={cons:Math.max(0,rate-sp),base:rate,otim:rate+sp},out={};
  for(var k in rates){var q={};for(var j in base)q[j]=base[j];q.rate=rates[k]/100;out[k]=simulate(q)}
  return {s:s,base:base,rates:rates,out:out,ir:ir,rate:rate};
}

  h+='<details><summary>Como calculamos</summary><p><b>Juros compostos:</b> a taxa anual é convertida em mensal pela equivalência (1 + taxa anual)^(1/12) − 1, e não por taxa ÷ 12, que subestimaria o rendimento.</p><p><b>IR regressivo:</b> incide só sobre o rendimento, por <b>aporte</b> (cada depósito tem a própria idade): 22,5% até 180 dias, 20% até 360, 17,5% até 720 e 15% acima. O saldo mostrado é <b>líquido</b>, como se você resgatasse naquele mês.</p><p><b>Cenários:</b> conservador e otimista variam a taxa em ± '+nf(S.cfg.spread,1)+' ponto(s) percentual(is) sobre a taxa base (ajustável em Ajustes).</p><p><b>Valores de hoje:</b> saldo líquido ÷ (1 + IPCA)^(meses ÷ 12). Mostra o poder de compra, não o número nominal.</p><p><b>Aporte necessário:</b> busca, por bisseção sobre a própria simulação (com IR e reajuste), o menor aporte que atinge a meta no prazo. Aportes entram no fim de cada mês.</p><p><b>Limites:</b> taxas e inflação são premissas fixas ao longo de todo o prazo; renda variável não é modelada. Isto é planejamento, não recomendação de investimento.</p></details></div>';

function niceStep(x){var p=Math.pow(10,Math.floor(Math.log(x)/Math.LN10)),f=x/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function chartSvg(series,months){
  var W=400,H=300,L=54,R=78,T=14,B=30,pw=W-L-R,ph=H-T-B,mx=0;
  series.forEach(function(s){s.v.forEach(function(v){if(v>mx)mx=v})});
  var st=niceStep((mx||1)/4),top=Math.ceil((mx||1)/st)*st;
  function X(t){return L+pw*t/months}function Y(v){return T+ph*(1-v/top)}
  var g='',v;for(v=0;v<=top+1e-9;v+=st)g+='<line class="gridl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="axt" x="'+(L-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+compact(v)+'</text>';
  var ts=months<=12?2:months<=24?6:months<=60?12:months<=120?24:48,t;
  for(t=0;t<=months;t+=ts)g+='<text class="axt" x="'+X(t).toFixed(1)+'" y="'+(H-10)+'" text-anchor="'+(t===0?'start':'middle')+'">'+(t===0?'0':(t>=24&&t%12===0?t/12+' anos':t+' m'))+'</text>';
  var labs=[];
  series.forEach(function(s){
    var d='';for(var i=0;i<s.v.length;i++)d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(s.v[i]).toFixed(1);
    g+='<path class="lnk" d="'+d+'" stroke="'+s.c+'"'+(s.dash?' stroke-dasharray="6 5"':'')+(s.o?' opacity="'+s.o+'"':'')+'/>';
    labs.push({y:Y(s.v[s.v.length-1]),t:s.l});
  });
  labs.sort(function(a,b){return a.y-b.y});for(var i=1;i<labs.length;i++)if(labs[i].y-labs[i-1].y<13)labs[i].y=labs[i-1].y+13;
  labs.forEach(function(l){g+='<text class="axt" style="fill:var(--fg)" x="'+(W-R+8)+'" y="'+(l.y+4).toFixed(1)+'">'+esc(l.t)+'</text>'});
  g+='<g id="xh" visibility="hidden"><line class="gridl" id="xhl" y1="'+T+'" y2="'+(T+ph)+'" style="stroke:var(--muted)"/>'+series.map(function(s,i){return '<circle id="xhc'+i+'" r="4.5" fill="'+s.c+'" stroke="var(--surface)" stroke-width="2"/>'}).join('')+'</g>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução do saldo ao longo do tempo" data-w="'+W+'" data-l="'+L+'" data-pw="'+pw+'" data-t="'+T+'" data-ph="'+ph+'" data-top="'+top+'" data-m="'+months+'">'+g+'<rect id="xhr" x="'+L+'" y="'+T+'" width="'+pw+'" height="'+ph+'" fill="transparent"/></svg><div class="tip" id="tip" hidden></div>';
}
function bindChart(box,series,months){
  var svg=$("svg",box),tip=$("#tip",box),rect=$("#xhr",box);if(!svg)return;
  var L=+svg.dataset.l,pw=+svg.dataset.pw,Tp=+svg.dataset.t,ph=+svg.dataset.ph,top=+svg.dataset.top,W=+svg.dataset.w;
  function mv(ev){
    var r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)*W/r.width,t=Math.round((px-L)/pw*months);t=Math.max(0,Math.min(months,t));
    var x=L+pw*t/months;$("#xh",svg).setAttribute("visibility","visible");$("#xhl",svg).setAttribute("x1",x);$("#xhl",svg).setAttribute("x2",x);
    var rows='';series.forEach(function(s,i){var c=$("#xhc"+i,svg);c.setAttribute("cx",x);c.setAttribute("cy",Tp+ph*(1-s.v[t]/top));rows+='<div><span><i class="dot" style="background:'+s.c+';opacity:'+(s.o||1)+'"></i> '+esc(s.l)+'</span><b>'+brlR0(s.v[t])+'</b></div>'});
    tip.innerHTML='<b>'+(t<24?t+' m':nf(t/12,1)+' anos')+'</b>'+rows;tip.hidden=false;
    var bw=box.getBoundingClientRect().width,left=(ev.clientX-box.getBoundingClientRect().left)+14;if(left+170>bw)left=left-184;tip.style.left=Math.max(0,left)+"px";tip.style.top="6px";
  }

  rect.addEventListener("pointerleave",function(){$("#xh",svg).setAttribute("visibility","hidden");tip.hidden=true});
}

/* ---------- folha: lançamento ---------- */
function openTx(t,pre){
  draft=t?clone(t):{id:"",k:"o",v:0,d:today(),c:S.cfg.cats[0],w:ME(),s:0,n:"",rep:false};
  if(pre)for(var k in pre)draft[k]=pre[k];
  sheetKind="tx";drawTx();
}
function readTx(){var f=fields();draft.v=parseMoney(f.v);draft.n=f.n!=null?f.n:draft.n;if(f.c!=null)draft.c=f.c;if(f.d)draft.d=f.d;if(f.s!=null)draft.s=+f.s;if(f.rep!=null)draft.rep=f.rep;if(f.cd!=null)draft.cd=f.cd;if(f.np!=null)draft.np=Math.max(1,Math.min(48,parseInt(f.np,10)||1));if(f.av!=null)draft.av=parseMoney(f.av)}
function drawTx(){
  var d=draft,isNew=!d.id,k=d.k,other=1-d.w;
  var h='<h3>'+(isNew?'Novo lançamento':'Editar lançamento')+'</h3><div class="seg">'+[["o","Despesa"],["i","Receita"],["t","Acerto"]].map(function(x){return '<button type="button" data-act="kind" data-id="'+x[0]+'" class="'+(k===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>';
  h+='<label class="f">Valor (R$)<input class="big" type="text" inputmode="decimal" data-f="v" value="'+fin(d.v)+'" placeholder="0,00" autocomplete="off"></label>';
  if(k==="t")h+='<p class="note">Registra que <b>'+esc(NM(d.w))+'</b> repassou o valor a <b>'+esc(NM(other))+'</b>. Isso quita (ou reduz) o saldo entre vocês e não entra em receitas nem despesas.</p>';
  else{
    h+='<label class="f">Descrição<input type="text" data-f="n" value="'+esc(d.n)+'" placeholder="ex.: Mercado da semana" autocomplete="off"></label>';
    var cl=k==="i"?INC:S.cfg.cats;if(cl.indexOf(d.c)<0){d.c=cl[0]}
    h+='<label class="f">Categoria<select data-f="c">'+opts(cl,d.c)+'</select></label>';
  }
  h+='<label class="f">Data<input type="date" data-f="d" value="'+esc(d.d)+'"></label>'+segW(d.w,k==="i"?"Quem recebeu":k==="t"?"Quem repassou":"Quem pagou");
  if(k==="o")h+='<label class="f">Divisão<select data-f="s"><option value="0"'+(d.s===0?' selected':'')+'>Dividir entre o casal ('+S.cfg.split+'/'+(100-S.cfg.split)+')</option><option value="1"'+(d.s===1?' selected':'')+'>Só de '+esc(NM(d.w))+'</option><option value="2"'+(d.s===2?' selected':'')+'>Só de '+esc(NM(other))+'</option></select></label>';
  if(k==="o"){
    var cs=live(S.cards);
    if(cs.length)h+='<label class="f">Pagamento<select data-f="cd"><option value="">Pix, débito ou dinheiro</option>'+cs.map(function(c){return '<option value="'+c.id+'"'+(d.cd===c.id?' selected':'')+'>Cartão '+esc(c.name)+'</option>'}).join('')+'</select></label>';
    if(isNew)h+='<label class="f">Parcelas<input type="text" inputmode="numeric" data-f="np" value="'+(d.np>1?d.np:1)+'" autocomplete="off"></label><details class="cmp"><summary>Comparar com pagar à vista</summary><label class="f">Preço à vista (R$)<input type="text" inputmode="decimal" data-f="av" value="'+fin(d.av||0)+'" placeholder="0,00" autocomplete="off"></label></details>';
    if(isNew||cs.length)h+='<p class="note" id="parcHint"></p>';
    if(d.ip)h+='<p class="note">Parcela <b>'+d.in+'/'+d.it+'</b> de uma compra parcelada. Editar aqui altera só esta parcela.</p>';
  }
  if(isNew&&k!=="t")h+='<label class="f chk"><input type="checkbox" data-f="rep"'+(d.rep?' checked':'')+'> Repetir todo mês (dia '+(+d.d.slice(8,10))+')</label>';
  if(d.r)h+='<p class="note">Lançamento gerado por um fixo. Editar aqui altera só este mês; para mudar os próximos, use <b>Fixos</b> em Gastos.</p>';
  h+='<button class="btn full" data-act="txsave">Salvar</button>'+(isNew?'':'<button class="btn danger full" data-act="txdel">'+(d.ip?'Excluir só esta parcela':'Excluir')+'</button>'+(d.ip?'<button class="btn danger full" data-act="txdelnext">Excluir esta e as seguintes</button>':''))+'<button class="btn sec full" data-act="close">Cancelar</button>';
  openSheet(h);parcHint();
}
function parcHint(){
  var el=$("#parcHint");if(!el||sheetKind!=="tx")return;
  var f=fields(),v=parseMoney(f.v),np=Math.max(1,Math.min(48,parseInt(f.np,10)||1)),cd=f.cd?find(S.cards,f.cd):null,av=parseMoney(f.av),h=[];
  if(v>0&&np>1){var P=splitParcelas(v,np);h.push('<b>'+np+'× de '+brl(P[P.length-1])+'</b>'+(P[0]!==P[np-1]?' (a 1ª de '+brl(P[0])+')':'')+'.')}
  if(cd&&f.d&&/^\d{4}-\d{2}-\d{2}$/.test(f.d)){var iv=invoiceOf(f.d,cd.close,cd.due);h.push('Entra na fatura que vence em <b>'+dBR(iv.due)+'</b>'+(np>1?' e segue mês a mês':'')+'.')}
  if(v>0&&np>1){
    var pv=parcelPV(v,np,goalRate());
    h.push('Pagar à vista compensa se o desconto passar de <b>'+pc(1-pv/v,1)+'</b> (preço abaixo de <b>'+brl(Math.round(pv))+'</b>), contra aplicar a <b>'+nf(S.cfg.goalPct,0)+'% do CDI</b> com IR regressivo e 1ª parcela em 30 dias.');
    if(av>0&&av<v){var yr=Math.pow(1+parcelRate(av,v,np),12)-1;h.push(av<=pv?'Com o preço à vista informado, <b>pagar à vista é melhor</b> (economiza '+brl(Math.round(pv-av))+' em valor presente). Juros implícitos do parcelado: <b>'+pc(yr,1)+' a.a.</b>':'Com o preço à vista informado, <b>parcelar e aplicar a diferença é melhor</b> ('+brl(Math.round(av-pv))+' a favor). Juros implícitos do parcelado: <b>'+pc(yr,1)+' a.a.</b>')}
    else if(av>0)h.push('O preço à vista informado não é menor que o parcelado.');
  }
  el.innerHTML=h.join(' ');
}
function saveTx(){
  readTx();var d=draft;
  if(!(d.v>0)){toast("Informe um valor maior que zero.");return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.d)){toast("Informe a data.");return}
  var card=d.k==="o"&&d.cd?find(S.cards,d.cd):null;if(card&&card.x)card=null;
  var np=(!d.id&&d.k==="o")?Math.max(1,Math.min(48,parseInt(d.np,10)||1)):1,name=d.k==="t"?"":d.n.trim();
  if(np>1&&d.rep){toast("Escolha entre parcelar e repetir todo mês.");return}
  function mk(id,v,date){var o={id:id,k:d.k,v:v,d:date,c:d.k==="t"?"Acerto":d.c,w:d.w,s:d.k==="o"?d.s:0,n:name};if(d.r)o.r=d.r;if(card){o.cd=card.id;o.m=invoiceOf(date,card.close,card.due).m}return o}
  if(np>1){var gid=uid(),P=splitParcelas(d.v,np);for(var i=0;i<np;i++){var o=mk("p"+gid+"_"+(i+1),P[i],addMonths(d.d,i));o.ip=gid;o.in=i+1;o.it=np;upsert(S.tx,o)}}
  else if(!d.id&&d.rep&&d.k!=="t"){
    var o2=mk(uid(),d.v,d.d),rr={id:uid(),k:o2.k,v:o2.v,c:o2.c,w:o2.w,s:o2.s,n:o2.n,day:+d.d.slice(8,10),from:d.d.slice(0,7)};if(card)rr.cd=card.id;
    upsert(S.rec,rr);ensureRec();
  }else{var o3=mk(d.id||uid(),d.v,d.d);if(d.ip){o3.ip=d.ip;o3.in=d.in;o3.it=d.it}upsert(S.tx,o3)}
  save();closeSheet();render();toast(np>1?np+" parcelas lançadas.":"Salvo.");
}

  var f=fields();draft.name=f.name!=null?f.name:draft.name;if(f.target!=null)draft.target=parseMoney(f.target);draft.base=parseMoney(f.base);draft.due=f.due||"";draft.ev=f.ev||"";

/* ---------- sincronização (Google Sheets via Apps Script, igual ao app Treino) ---------- */
function SY(){try{return JSON.parse(localStorage.getItem(SYKEY))||{}}catch(e){return {}}}
var sync={st:(SY().api&&SY().id)?"idle":"off",dirty:false,timer:null,seq:0,last:0};
function post(o){return fetch(SY().api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)}).then(function(r){return r.json()})}
function b64(u){var r="",i;for(i=0;i<u.length;i+=8192)r+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(r)}
function pack(str){
  if(typeof CompressionStream==="undefined"||typeof Response==="undefined")return Promise.resolve(str);
  try{var cs=new CompressionStream("gzip"),w=cs.writable.getWriter();w.write(new TextEncoder().encode(str));w.close();
    return new Response(cs.readable).arrayBuffer().then(function(buf){var o="gz1:"+b64(new Uint8Array(buf));return o.length<str.length?o:str}).catch(function(){return str})}catch(e){return Promise.resolve(str)}
}
function unpack(txt){
  if(!txt||txt.indexOf("gz1:")!==0)return Promise.resolve(txt);
  if(typeof DecompressionStream==="undefined")return Promise.reject(new Error("Este navegador não abre dados compactados. Atualize o iOS/Safari."));
  var bin=atob(txt.slice(4)),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  var ds=new DecompressionStream("gzip"),w=ds.writable.getWriter();w.write(u);w.close();return new Response(ds.readable).text();
}
/* mescla por registro (id + carimbo u): o mais novo vence; exclusões viajam como lápide (x) */
function mergeList(a,b){var m={};(a||[]).forEach(function(x){m[x.id]=x});(b||[]).forEach(function(x){var y=m[x.id];if(!y||(x.u||0)>(y.u||0))m[x.id]=x});return Object.keys(m).map(function(k){return m[k]})}
/* conquistas: vale a data de desbloqueio mais antiga */
function mergeAch(a,b){var m={};(a||[]).concat(b||[]).forEach(function(x){var y=m[x.id];if(!y||(x.d||"")<(y.d||""))m[x.id]=x});return Object.keys(m).map(function(k){return m[k]})}
function mergeObj(a,b){return (b&&(b.u||0)>((a&&a.u)||0))?b:a}
function mergeState(L,R){
  var o=blank();
  o.cfg=mergeObj(L.cfg,R.cfg)||o.cfg;o.bud=mergeObj(L.bud,R.bud)||o.bud;o.sim=mergeObj(L.sim,R.sim)||null;
  ["tx","rec","goals","cont","day","cards"].forEach(function(k){o[k]=mergeList(L[k],R[k])});o.ach=mergeAch(L.ach,R.ach);
  var b=blank().cfg;for(var k in b)if(o.cfg[k]===undefined)o.cfg[k]=b[k];
  o.updatedAt=Math.max(L.updatedAt||0,R.updatedAt||0);return o;
}
function setSync(st){sync.st=st;updDot()}
function schedPush(){if(sync.st==="off")return;clearTimeout(sync.timer);sync.timer=setTimeout(push,2500)}
function push(){
  var sy=SY();if(!sy.api)return Promise.resolve();if(saveT)persist();
  var seq0=sync.seq;setSync("syncing");
  return pack(JSON.stringify(S)).then(function(data){return post({a:"save",p:sy.id,pin:sy.pin,data:data})}).then(function(r){if(!r.ok)throw new Error(r.erro||"erro");if(sync.seq===seq0)sync.dirty=false;setSync("ok")}).catch(function(e){setSync("err");toast(String(e.message||e).indexOf("PIN")>=0?"PIN incorreto.":"Sem conexão. As alterações ficam salvas no aparelho.")});
}
function pull(){
  var sy=SY();if(!sy.api)return Promise.resolve();setSync("syncing");sync.last=Date.now();
  return post({a:"login",p:sy.id,pin:sy.pin,nome:sy.id}).then(function(r){if(!r.ok)throw new Error(r.erro||"erro");return post({a:"load",p:sy.id,pin:sy.pin})}).then(function(r){
    if(!r.ok)throw new Error(r.erro||"erro");return unpack(r.data||"")
  }).then(function(txt){
    var remote=null;try{remote=txt?JSON.parse(txt):null}catch(e){}
    if(!remote)return push();
    try{localStorage.setItem("joint.backup",JSON.stringify(S))}catch(e){}
    S=mergeState(S,remote);ensureRec();persist();render();return push();
  }).catch(function(e){setSync("err");toast(String(e.message||e).indexOf("PIN")>=0?"PIN incorreto.":"Não consegui sincronizar agora.")});
}
document.addEventListener("visibilitychange",function(){if(started&&document.visibilityState==="visible"&&sync.st!=="off"&&Date.now()-sync.last>20000)pull()});


/* ---------- acesso: usuário + PIN de 4 dígitos (trava local do aparelho) ----------
   Guarda só um hash PBKDF2 (usuário+PIN, sal aleatório). Os dados continuam no aparelho; isto impede o uso por quem pega o celular. */
var AUKEY="joint.auth",started=false,hiddenAt=0,authMode="",cdT=null;

    var cur=AU();
    if(h===cur.h){cur.f=0;cur.t=0;auPut(cur);authOpen();return}
    cur.f=(cur.f||0)+1;if(cur.f%5===0)cur.t=Date.now()+Math.min(900000,30000*Math.pow(2,cur.f/5-1));auPut(cur);
    f.elements.p.value="";btn.disabled=false;
    if(cur.t&&cur.t>Date.now()){countdown()}else{say("Usuário ou PIN incorretos. "+(5-cur.f%5)+" tentativa(s) antes do bloqueio temporário.");f.elements.p.focus()}
  }).catch(function(){btn.disabled=false;say("Erro ao verificar. Tente de novo.")});
}
function authForgot(){
  if(!confirm("Esqueci o PIN\n\nIsso apaga TODOS os dados e ajustes deste aparelho, inclusive a sincronização, e você cria um novo acesso. Se usa sincronização, reconecte depois para trazer os dados de volta. Continuar?"))return;
  Object.keys(localStorage).filter(function(k){return k.indexOf("joint.")===0}).forEach(function(k){localStorage.removeItem(k)});
  location.reload();
}
function lockNow(){closeSheet();if(AU().h)showAuth("login")}
document.addEventListener("visibilitychange",function(){
  if(!started)return;var a=AU(),m=a.m==null?5:a.m;
  if(document.visibilityState==="hidden"){hiddenAt=Date.now();if(m===0)lockNow()}
  else if(a.h&&!$("#auth")&&m>0&&Date.now()-hiddenAt>=m*60000)lockNow();
});
function openPin(){sheetKind="pin";openSheet('<h3>Alterar PIN</h3><label class="f">PIN atual<input type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" data-f="p0"></label><div class="grid2"><label class="f">Novo PIN<input type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" data-f="p1"></label><label class="f">Repita<input type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" data-f="p2"></label></div><button class="btn full" data-act="pinsave">Salvar novo PIN</button><button class="btn sec full" data-act="close">Cancelar</button>')}

applyTheme();

  if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});
  showAuth(AU().h?"login":"setup");
  var sp=$("#splash");if(sp){setTimeout(function(){sp.classList.add("out");setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp)},450)},Math.max(0,800-performance.now()))}
}
boot();
window.__joint={S:function(){return S}}; /* ajuda de depuração */
})();
